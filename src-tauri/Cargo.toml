[package]
name = "xd-to-figma"
version = "0.1.0"
description = "Native Adobe XD to Figma conversion utility"
authors = ["you"]
edition = "2021"

[lib]
name = "xd_to_figma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
