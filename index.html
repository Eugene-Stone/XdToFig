<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>XD → FigCraft</title>
  </head>
  <body>
    <main class="window">
      <header class="header">
        <div class="app-icon" aria-hidden="true">✳</div>
        <div><h1>XD → FigCraft</h1><p>Конвертация макетов в FigCraft</p></div>
      </header>

      <section id="drop-zone" class="drop-zone" tabindex="0" aria-label="Перетащите файл Adobe XD">
        <div class="file-icon" aria-hidden="true">XD</div>
        <strong id="file-title">Перетащите файл .xd сюда</strong>
        <span id="file-subtitle">или</span>
        <button id="browse-input" class="text-button" type="button">Выбрать файл</button>
      </section>

      <label class="field-label" for="output-path">Сохранить .figcraft в</label>
      <div class="path-row">
        <input id="output-path" type="text" placeholder="Выберите место для .figcraft файла" readonly />
        <button id="browse-output" class="secondary-button" type="button">Обзор…</button>
      </div>

      <div class="progress-wrap" aria-live="polite">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="status" class="status">Выберите файл Adobe XD, чтобы начать</p>
      </div>

      <button id="convert" class="convert-button" type="button" disabled>Конвертировать в FigCraft</button>
      <p class="footnote">Файлы обрабатываются локально на этом Mac</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
